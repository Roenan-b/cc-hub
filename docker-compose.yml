# Optional: Postgres in Docker instead of a local Postgres service.
# The setup script uses a local Postgres by default (CCHUB_DOCKER_DB=0).
# To use this instead: set CCHUB_DOCKER_DB=1 and DATABASE_URL=postgres://cchub:<pw>@127.0.0.1:5433/cchub in .env.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cchub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cchub
    ports:
      - "127.0.0.1:5433:5432"   # loopback only
    volumes:
      - cchub-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cchub -d cchub"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  cchub-pg:
