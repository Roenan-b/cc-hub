# Deploy to your server on every push to main, after the tests pass.
#
# Runs only when the repo variable DEPLOY_HOST is set, so forks and clones
# without a server are unaffected. The runner joins your tailnet with an
# ephemeral, tagged Tailscale node and SSHes to the server over it, so the
# server never exposes SSH to the internet. Pull requests never deploy.
#
# Setup: docs/HOSTING.md. Repo variables: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH (optional).
# Repo secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  test:
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cchub, POSTGRES_PASSWORD: cchub, POSTGRES_DB: cchub_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cchub -d cchub_test" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: npm ci && npm run check && npm test
        env: { TEST_DATABASE_URL: "postgres://cchub:cchub@127.0.0.1:5432/cchub_test" }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Join tailnet (ephemeral)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Update the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/cc-hub' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER_NAME@$HOST" \
            "cd $DEPLOY_PATH && ./scripts/update.sh main"
