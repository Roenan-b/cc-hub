name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Include any security or permission implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: roadmap
    attributes:
      label: Checks
      options:
        - label: I checked the [roadmap](https://github.com/Roenan-b/cc-hub/blob/main/docs/ROADMAP.md) and existing issues.
          required: true
